# =========================================================================
# Example: global 2-D surface tracking, 1 year (the simple / pilot version).
#
# Same setup as config_global_2d_10yr.yaml but shorter -- a 1-year calibration
# run that validates seeding, attrition and timing before committing to the
# full 10-year run. NetCDF output here (a single modest file).
#
# Paths below are placeholders -- edit them for your machine.
# Full option reference: docs/configuration.md
# =========================================================================
mode:
  Fdrift2D: true
  Fdrift3D: false
  time_dir: 1.0
  var_u: unod                 # node-layout velocity -> uv_interp: barycentric
  var_v: vnod
  var_eta: ssh
  sigma_layer: 0

numerics:
  dt: 86400.0                 # 1 day
  integrator: rk2
  uv_interp: barycentric      # REQUIRED for node-layout unod/vnod
  output_freq: 5              # record every 5 days
  temporal_interp: true
  temporal_reconstruction: linear
  prefetch_size: 8
  checkpoint_freq: 100        # restart safety

mesh:
  type: fesom2
  meshpath: path/to/core2/fesom.mesh.diag.nc
  rotation: fesom2

data:
  ncinput: path/to/fesom2_output       # directory of <var>.fesom.<YYYY>.nc files
  inicloud: path/to/seeds.dat
  output_path: tracks_global_2d_1yr.nc  # .nc = NetCDF (set numerics.output_flush_every to read mid-run)
  time_averaging: mean

time:
  start_time_idx: 8035        # dataset-specific; set yours
  n_steps: 365                # 1 year
  n_pulses: 12                # a new batch every 30 days (12 over the year)
  pulse_interval: 2592000.0   # 30 days in seconds
  on_exhausted: stop
  num_runs: 1
