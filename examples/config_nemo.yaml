# ==========================================================================
# kelp example — NEMO, exact Arakawa C-grid path, 2-D surface (docs/nemo.md)
# ==========================================================================
# mesh.nemo_grid: cgrid tracks on the model's own staggering (F-point nodes,
# wet T-cell elements, Delandmeter & van Sebille flux scheme): works on
# rotated/curvilinear and global ORCA grids (E-W seam, T/F-pivot north fold,
# with or without halos), crops get open absorbing edges. uv_interp becomes
# `cgrid` by itself (naming another interpolator is refused).
# For 3-D see config_nemo_cgrid_3d.yaml. Variable names, mesh_mask vs
# domain_cfg and other input pitfalls: skill `kelp-nemo`.
#
# The default `nemo_grid: tpoint` (nodes = T-points, uv_interp: barycentric,
# 2-D, grid axes within 2 deg of E/N) is early work; omit nemo_grid only for it.

mode:
  Fdrift2D: true
  time_dir: 1.0
  # var_u: uo            # override velocity/ssh names if your XIOS field defs differ
  # var_v: vo
  # sample_vars: [thetao, so]   # T-cell values along the track (exact names)

numerics:
  dt: 3600.0
  integrator: rk4          # euler | rk2 | rk4 (no rk45, no PCHIP)
  output_freq: 1
  temporal_interp: true    # blend between snapshots

mesh:
  type: nemo
  nemo_grid: cgrid
  meshpath: path/to/mesh_mask.nc        # mesh_mask.nc or domain_cfg.nc: glamf/gphif/tmask, e2u/e1v
  # rotation: fesom2                    # Arctic / transpolar runs (cells degenerate above ~88 N)

data:
  ncinput: path/to/EXP_grid_T.nc        # file, glob or list; grid_U / grid_V siblings by the `grid_T` token
  # ncinput_u: path/to/EXP_U_*.nc       # explicit grids when the names lack the `grid_T` token
  # ncinput_v: path/to/EXP_V_*.nc
  inicloud: particles.dat                # seeds: "lon lat [depth] [release_sec]"
  output_path: ./.tmp/nemo_tracks.zarr
  time_averaging: instant                # snapshots; means: time_stamp: centre + time_window (XIOS stamps window centres)

time:
  start_time_idx: 0
  n_steps: 240
  on_exhausted: stop
