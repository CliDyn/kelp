[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kelp-tracker"
dynamic = ["version"]
description = "KELP, the Kinematic Engine for Lagrangian Particles: a particle tracker for unstructured ocean model meshes (FESOM2, FESOM-C), structured NEMO grids and HEALPix grids"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Ivan Kuznetsov"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "dask[array]",
    "numba>=0.58",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "cartopy>=0.21"]
zarr = ["zarr>=3"]   # writers.py uses Zarr v3 API (create_array + dimension_names)
healpix = ["healpy>=1.16", "fsspec", "pandas", "pyarrow"]   # HEALPix meshes; kerchunk reference stores
kerchunk = ["gribscan"]   # GRIB-backed kerchunk stores (needs the eccodes library)
dev = [
    "pytest>=7",
    "pytest-cov",
]
# = viz + zarr + healpix + dev.  kerchunk/gribscan is left out on purpose:
# it needs the eccodes C library, which no wheel provides.
all = ["matplotlib>=3.6", "cartopy>=0.21", "zarr>=3", "healpy>=1.16", "fsspec", "pandas", "pyarrow", "pytest>=7", "pytest-cov"]

[project.scripts]
kelp = "kelp.cli.main:main"

[project.urls]
Homepage = "https://github.com/CliDyn/kelp"
Issues = "https://github.com/CliDyn/kelp/issues"

# ---------------------------------------------------------------------
# Build configuration: src layout
# ---------------------------------------------------------------------
[tool.setuptools.dynamic]
version = {attr = "kelp.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kelp*"]

# ---------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: external comparison tests (e.g. vs Parcels). Deselected by default.",
]
addopts = "-m 'not slow'"
